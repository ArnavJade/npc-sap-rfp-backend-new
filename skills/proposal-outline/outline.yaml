# YASH SAP RFP response - standard outline (ported from the old generator's STATIC_SECTIONS, 42 rows).
#
# Fields
#   id        section number; always a quoted string ("4.10" unquoted would parse as a float).
#   title     heading text; {client_name} is replaced with the ledger's client name.
#   level     1 = chapter, 2 = section (3 only for client-required subsections that outline() adds).
#   narrative true = a section-writer drafts body text for it. Every row is true: the old generator
#             wrote a 2-3 sentence intro under each chapter heading and an intro before every table
#             or diagram.
#   artifact  "" or table:<key> / diagram:<key>; the renderer fills it from the ledger and places it
#             AFTER the narrative. Writers never repeat it in the draft.
#   words     [floor, ceiling]. The ceiling is a HARD ceiling, never a target to fill toward (old
#             word_target). The floor applies only when the section has client-specific material;
#             with none, 2-3 honest sentences are correct. Adjustments: proposal-outline SKILL.md.
#   facts     bid_facts views the writer loads. Every writer also loads `requirements` once and
#             `excerpts:<id>` for each of its sections; `figures` only before using a {{fig:...}}.
#   guidance  per-section guidance file, relative to this skill folder ("" = none).
#   combine_resource_effort  default of the resource/effort combine rule (see SKILL.md).

sections:
